-size:12px}.student-cell{display:flex;gap:10px;align-items:center;font-weight:550;color:#344456}.avatar{display:grid;place-items:center;width:32px;height:32px;background:#edf4f1;color:#527e70;border-radius:50%;font-size:12px;font-weight:500}.avatar.tone-1{background:#edf1fa;color:#6980aa}.avatar.tone-2{background:#f6f0e9;color:#b18b65}.student-number{font-variant-numeric:tabular-nums;letter-spacing:.5px;color:#83909e}.class-badge{background:#f2f5f8;border-radius:4px;padding:5px 8px;font-size:12px;color:#728195}.score-cell{font-variant-numeric:tabular-nums;color:#3e5868;font-weight:550}.action-col{width:175px}.row-actions{display:flex;align-items:center;gap:16px}.text-action{padding:4px 0;border:0;background:none;color:#5b7e9b;font-size:12px}.text-action:hover{text-decoration:underline}.text-action.edit{color:var(--green)}.text-action.delete{color:#bc7a77}.table-footer{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border);padding:17px 25px;color:#94a0ab;font-size:12px;gap:16px}.local-status{display:flex;align-items:center;gap:7px}.local-status i{width:5px;height:5px;border-radius:50%;background:#7fa997}.bottom-notes{display:flex;justify-content:space-between;gap:20px;font-size:11px;color:#9ba4ad;line-height:1.8;margin-top:19px}.bottom-notes p{margin:0}.bottom-notes>span{white-space:nowrap}.empty-state{text-align:center;padding:55px 20px;color:#9aa5ae}.empty-state>span{font-size:34px;color:#b7c8c1}.empty-state h3{font-size:15px;color:#677b83;font-weight:500}.empty-state p{font-size:12px}[hidden]{display:none!important}dialog{border:1px solid #e2e8e6;border-radius:12px;padding:0;width:560px;max-width:calc(100vw - 32px);max-height:calc(100vh - 40px);box-shadow:0 24px 100px #1f354133;color:#233345}dialog::backdrop{background:#172a3b55;backdrop-filter:blur(3px)}.dialog-heading{display:flex;justify-content:space-between;align-items:flex-start;padding:27px 28px 22px;border-bottom:1px solid var(--border)}.dialog-heading h2{margin:8p   <script type="module">
const STORAGE_KEY = 'qinghe-students-v1';
const fields = ['name', 'number', 'gender', 'className', 'score', 'notes'];
const headers = ['姓名', '学号', '性别', '班级', '成绩', '备注'];
const seedStudents = [
  ['林知夏', '20260001', '女', '高一（1）班', '92', ''],
  ['陈宇航', '20260002', '男', '高一（1）班', '85', ''],
  ['周雨桐', '20260003', '女', '高一（2）班', '96', '学习委员'],
  ['王子墨', '20260004', '男', '高一（1）班', '88', ''],
  ['李沐晴', '20260005', '女', '高一（2）班', '90', ''],
  ['张景行', '20260006', '男', '高一（2）班', '79', ''],
  ['许星禾', '20260007', '女', '高一（1）班', '94', ''],
  ['刘亦辰', '20260008', '男', '高一（2）班', '83', ''],
  ['赵书宁', '20260009', '女', '高一（1）班', '91', ''],
  ['吴明远', '20260010', '男', '高一（2）班', '87', '']
].map((values, i) => ({id: `sample-${i + 1}`, ...Object.fromEntries(fields.map((key, j) => [key, values[j]]))}));

function filterStudents(students, keyword = '', className = '') {
  const needle = keyword.trim().toLocaleLowerCase();
  return students.filter(student => (!className || student.className === className) && (!needle || [student.name, student.number].some(value => String(value ?? '').toLocaleLowerCase().includes(needle))));
}

function parseCSV(text) {
  const rows = []; let row = [], value = '', quoted = false;
  text = text.replace(/^\uFEFF/, '');
  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    if (char === '"') {
      if (quoted && text[i + 1] === '"') {value += '"'; i++;}
      else if (quoted || value.length === 0) quoted = !quoted;
      else value += char;
    } else if (char === ',' && !quoted) {row.push(value); value = '';}
    else if ((char === '\n' || char === '\r') && !quoted) {
      row.push(value); rows.push(row); row = []; value = '';
      if (char === '\r' && text[i + 1] === '\n') i++;
    } else value += char;
  }
  if (value.length || row.length) {row.push(value); rows.push(row);}
  return rows.filter(values => values.some(cell => cell !== ''));
}

function importStudents(text, createId = () => crypto.randomUUID()) {
  const rows = parseCSV(text);
  if (!rows.length) return [];
  const first = rows[0].map(value => value.trim());
  const hasHeader = first.includes('姓名') || first.includes('name');
  const positions = hasHeader ? fields.map((key, i) => first.findIndex(value => value === key || value === headers[i])) : fields.map((_, i) => i);
  return rows.slice(hasHeader ? 1 : 0).map(row => ({id: createId(), ...Object.fromEntries(fields.map((key, i) => [key, row[positions[i]] ?? '']))}));
}

function exportStudents(students) {
  const quote = value => `"${String(value ?? '').replaceAll('"', '""')}"`;
  return '\uFEFF' + [headers, ...students.map(student => fields.map(key => student[key]))].map(row => row.map(quote).join(',')).join('\r\n') + '\r\n';
}


const $ = selector => document.querySelector(selector);
let students;
try {students = JSON.parse(localStorage.getItem(STORAGE_KEY) ?? 'null');} catch {students = null;}
if (!Array.isArray(students)) students = structuredClone(seedStudents);
let editingId = null;
const form = $('#student-form');
const dialog = $('#student-dialog');
const detailDialog = $('#detail-dialog');
const keyword = $('#keyword');
const classFilter = $('#class-filter');

function persist() {localStorage.setItem(STORAGE_KEY, JSON.stringify(students));}
function visibleStudents() {return filterStudents(students, keyword.value, classFilter.value);}

function render() {
  const selectedClass = classFilter.value;
  const classes = [...new Set(students.map(student => student.className).filter(Boolean))];
  if (selectedClass && !classes.includes(selectedClass)) classes.push(selectedClass);
  classFilter.replaceChildren(new Option('全部班级', ''), ...classes.map(name => new Option(name, name)));
  classFilter.value = selectedClass;
  const visible = visibleStudents();
  const body = $('#student-rows'); body.replaceChildren();
  visible.forEach((student, index) => {
    const row = document.createElement('tr');
    const cell = (value, className = '') => {const td = document.createElement('td'); td.textContent = value; td.className = className; row.append(td); return td;};
    cell(String(index + 1).padStart(2, '0'));
    const nameCell = cell(''); const nameWrap = document.createElement('div'); nameWrap.className = 'student-cell';
    const avatar = document.createElement('span'); avatar.className = `avatar tone-${index % 3}`; avatar.setAttribute('aria-hidden', 'true'); avatar.textContent = Array.from(student.name || '学')[0];
    const name = document.createElement('span'); name.textContent = student.name || '—'; nameWrap.append(avatar, name); nameCell.append(nameWrap);
    cell(student.number || '—', 'student-number'); cell(student.gender || '—');
    const classCell = cell(''); const badge = document.createElement('span'); badge.className = 'class-badge'; badge.textContent = student.className || '—'; classCell.append(badge);
    cell(student.score || '—', 'score-cell');
    const actions = cell(''); const actionWrap = document.createElement('div'); actionWrap.className = 'row-actions';
    [['查看', '', () => showDetail(student)], ['编辑', 'edit', () => openForm(student)], ['删除', 'delete', () => {students = students.filter(item => item.id !== student.id); persist(); render();}]].forEach(([label, className, action]) => {
      const button = document.createElement('button'); button.type = 'button'; button.textContent = label; button.className = `text-action ${className}`; button.setAttribute('aria-label', `${label}学生${student.name || student.number || ''}`); button.addEventListener('click', action); actionWrap.append(button);
    });
    actions.append(actionWrap); body.append(row);
  });
  $('#empty-state').hidden = visible.length > 0;
  $('#total-count').textContent = students.length;
  $('#result-count').textContent = visible.length === students.length ? `共 ${students.length} 条记录` : `查询到 ${visible.length} 条记录，共 ${students.length} 条`;
}

function openForm(student = null) {
  editingId = student?.id ?? null; form.reset();
  $('#dialog-title').textContent = student ? '编辑学生' : '新增学生';
  fields.forEach(key => {
    const control = form.elements.namedItem(key);
    if (key === 'gender' && student?.gender && ![...control.options].some(option => option.value === student.gender)) control.add(new Option(student.gender, student.gender));
    control.value = student?.[key] ?? '';
  });
  dialog.showModal(); $('#student-name').focus();
}

function showDetail(student) {
  const detail = $('#student-detail'); detail.replaceChildren();
  fields.forEach((key, index) => {const term = document.createElement('dt'); term.textContent = headers[index]; const value = document.createElement('dd'); value.textContent = student[key] || '—'; detail.append(term, value);});
  detailDialog.showModal();
}

$('#add-student').addEventListener('click', () => openForm());
$('#close-dialog').addEventListener('click', () => dialog.close());
$('#cancel-dialog').addEventListener('click', () => dialog.close());
$('#close-detail').addEventListener('click', () => detailDialog.close());
$('#done-detail').addEventListener('click', () => detailDialog.close());
form.addEventListener('submit', event => {
  event.preventDefault();
  const record = {id: editingId ?? crypto.randomUUID(), ...Object.fromEntries(fields.map(key => [key, form.elements.namedItem(key).value]))};
  if (editingId !== null) students = students.map(student => student.id === editingId ? record : student);
  else students.push(record);
  persist(); dialog.close(); render();
});
$('#search-form').addEventListener('submit', event => {event.preventDefault(); render();});
keyword.addEventListener('input', render); classFilter.addEventListener('change', render);
$('#reset-search').addEventListener('click', () => {keyword.value = ''; classFilter.value = ''; render();});
$('#import-csv').addEventListener('click', () => $('#import-file').click());
$('#import-file').addEventListener('change', async event => {
  const file = event.target.files[0]; if (!file) return;
  try {students.push(...importStudents(await file.text())); persist(); render();}
  finally {event.target.value = '';}
});
$('#export-csv').addEventListener('click', () => {
  const blob = new Blob([exportStudents(visibleStudents())], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob); const anchor = document.createElement('a');
  anchor.href = url; anchor.download = '学生信息.csv'; document.body.append(anchor); anchor.click(); anchor.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
persist(); render();

</script>

<body>
  <header class="topbar"><div class="brand"><span class="brand-icon" aria-hidden="true">学</span><span>青禾学籍<span class="brand-divider">/</span><span class="brand-secondary">学生信息管理</span></span></div><span class="top-label">学生管理工作台</span></header>
  <main>
    <div class="breadcrumb">管理工作台 <span>/</span> 学生信息</div>
    <section class="page-heading"><div><div class="eyebrow">STUDENT DIRECTORY</div><h1>学生信息管理</h1><p>每一份学生档案，都在这里清晰有序。</p></div><button type="button" id="add-student" class="button primary"><span aria-hidden="true">＋</span> 新增学生</button></section>
    <section class="workspace" aria-labelledby="list-heading">
      <div class="section-heading"><div class="section-title"><span class="small-icon" aria-hidden="true">▤</span><h2 id="list-heading">学生列表</h2><span id="total-count" class="count">10</span></div><div class="file-actions"><input type="file" id="import-file" accept=".csv,text/csv" hidden><button type="button" id="import-csv" class="button secondary"><span aria-hidden="true">↥</span> 导入 CSV</button><button type="button" id="export-csv" class="button secondary"><span aria-hidden="true">↧</span> 导出 CSV</button></div></div>
      <form id="search-form" class="searchbar" role="search"><div class="search-field"><label class="sr-only" for="keyword">搜索姓名或学号</label><span aria-hidden="true">⌕</span><input id="keyword" type="search" placeholder="搜索姓名或学号" autocomplete="off"></div><div class="class-filter"><label for="class-filter">班级</label><select id="class-filter"><option value="">全部班级</option></select></div><button type="submit" class="button search-button">查询</button><button type="button" id="reset-search" class="reset-button">重置</button></form>
      <div class="table-scroll"><table><thead><tr><th class="number-col" scope="col">序号</th><th scope="col">学生姓名</th><th scope="col">学号</th><th scope="col">性别</th><th scope="col">班级</th><th scope="col">成绩</th><th scope="col" class="action-col">操作</th></tr></thead><tbody id="student-rows"></tbody></table></div>
      <div id="empty-state" class="empty-state" hidden><span aria-hidden="true">▤</span><h3>暂无学生信息</h3><p>可以新增学生、导入 CSV，或调整查询条件。</p></div>
      <footer class="table-footer"><span id="result-count">共 10 条记录</span><span class="local-status"><i aria-hidden="true"></i>数据保存在当前浏览器</span></footer>
    </section>
    <div class="bottom-notes"><p>CSV 字段：姓名、学号、性别、班级、成绩、备注。导入会追加记录，导出包含当前查询结果。</p><span>青禾 · 让管理更轻松</span></div>
  </main>
  <dialog id="student-dialog" aria-labelledby="dialog-title"><form id="student-form" novalidate><div class="dialog-heading"><div><span class="eyebrow">STUDENT PROFILE</span><h2 id="dialog-title">新增学生</h2></div><button type="button" class="close-button" id="close-dialog" aria-label="关闭">×</button></div><div class="form-grid"><div class="form-field"><label for="student-name">姓名</label><input id="student-name" name="name" type="text" placeholder="请输入姓名"></div><div class="form-field"><label for="student-number">学号</label><input id="student-number" name="number" type="text" placeholder="请输入学号"></div><div class="form-field"><label for="student-gender">性别</label><select id="student-gender" name="gender"><option value="">未填写</option><option>男</option><option>女</option><option>其他</option></select></div><div class="form-field"><label for="student-class">班级</label><input id="student-class" name="className" type="text" placeholder="例如：高一（1）班"></div><div class="form-field full-width"><label for="student-score">成绩</label><input id="student-score" name="score" type="text" inputmode="decimal" placeholder="请输入成绩"></div><div class="form-field full-width"><label for="student-notes">备注</label><textarea id="student-notes" name="notes" rows="3" placeholder="填写学生相关备注"></textarea></div></div><div class="dialog-footer"><button type="button" id="cancel-dialog" class="button secondary">取消</button><button type="submit" id="save-student" class="button primary">保存学生</button></div></form></dialog>
  <dialog id="detail-dialog" aria-labelledby="detail-title"><div class="dialog-heading"><div><span class="eyebrow">STUDENT PROFILE</span><h2 id="detail-title">学生详情</h2></div><button type="button" class="close-button" id="close-detail" aria-label="关闭详情">×</button></div><dl id="student-detail" class="detail-grid"></dl><div class="dialog-footer"><button type="button" id="done-detail" class="button primary">关闭</button></div></dialog>
</body>
</html>
